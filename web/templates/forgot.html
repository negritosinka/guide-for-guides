<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paroles atjaunošana - Guide for Guides</title>
</head>
<body>
  <h1>Paroles atjaunošana</h1>

  {{if .Done}}
    <p>Ja šāds konts pastāv, uz e-pastu ir nosūtīta saite paroles maiņai.</p>
  {{else}}
    <form method="post" action="/forgot">
      <p>
        <label>E-pasts<br>
        <input type="email" name="email" required></label>
      </p>
      <button type="submit">Nosūtīt saiti</button>
    </form>
  {{end}}

  <p><a href="/login">Atpakaļ uz ieeju</a></p>
</body>
</html>
