<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paslēptās pamācības - Administrācija</title>
</head>
<body>
  <h1>Paslēptās pamācības</h1>
  <p><a href="/admin">Atpakaļ</a></p>

  {{range .Rows}}
    <p>
      #{{.ID}} | {{.Title}} |
      <a href="{{.URL}}" target="_blank" rel="noopener nofollow">oriģināls</a>
    </p>
    <form method="post" action="/admin/hidden/{{.ID}}/restore">
      <button type="submit">Atjaunot</button>
    </form>
  {{else}}
    <p>Nav paslēptu pamācību.</p>
  {{end}}
</body>
</html>
