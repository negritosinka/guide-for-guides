<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация - Guide for Guides</title>
</head>
<body>
  <h1>Регистрация</h1>

  {{if .Done}}
    <p>Если этот email свободен, аккаунт создан. Подтверждение по почте добавим на следующем шаге.</p>
  {{else}}
    {{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}
    <form method="post" action="/register">
      <p>
        <label>Email<br>
        <input type="email" name="email" value="{{.Email}}" required autocomplete="email"></label>
      </p>
      <p>
        <label>Пароль (минимум 10 символов)<br>
        <input type="password" name="password" required minlength="10" autocomplete="new-password"></label>
      </p>
      <button type="submit">Зарегистрироваться</button>
    </form>
  {{end}}
</body>
</html>
