<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reģistrācija - Guide for Guides</title>
</head>
<body>
  <h1>Reģistrācija</h1>

  {{if .Done}}
    <p>Ja šis e-pasts ir brīvs, konts ir izveidots. Pārbaudiet savu e-pastu un apstipriniet adresi.</p>
  {{else}}
    {{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}
    <form method="post" action="/register">
      <p>
        <label>E-pasts<br>
        <input type="email" name="email" value="{{.Email}}" required></label>
      </p>
      <p>
        <label>Parole (vismaz 10 rakstzīmes)<br>
        <input type="password" name="password" required minlength="10"></label>
      </p>
      <button type="submit">Reģistrēties</button>
    </form>
  {{end}}
</body>
</html>
