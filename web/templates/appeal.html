<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apelācija - Guide for Guides</title>
</head>
<body>
  <h1>Apelācija par konta bloķēšanu</h1>
  <p>Ja jūsu konts ir bloķēts, ievadiet e-pastu un paroli un paskaidrojiet, kāpēc bloķēšana būtu jāatceļ.</p>

  {{if .Error}}<p style="color:red">{{.Error}}</p>{{end}}

  <form method="post" action="/appeal">
    <p>
      <label>E-pasts<br>
      <input type="email" name="email" value="{{.Email}}" required></label>
    </p>
    <p>
      <label>Parole<br>
      <input type="password" name="password" required></label>
    </p>
    <p>
      <label>Paskaidrojums (10 līdz 1000 rakstzīmes)<br>
      <textarea name="message" rows="5" cols="50" maxlength="1000" required></textarea></label>
    </p>
    <button type="submit">Iesniegt apelāciju</button>
  </form>

  <p><a href="/login">Uz ieeju</a></p>
</body>
</html>
